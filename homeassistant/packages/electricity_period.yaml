# The electricity price period the dehumidifier schedules by: off_peak, mid_peak or on_peak.
# These are my utility's time-of-use hours (Xcel Energy Minnesota): off-peak every day midnight to 6 am, on-peak
# weekdays 6 to 9 pm, mid-peak the rest. Change the hours to your own plan.
template:
  - sensor:
      - name: Xcel TOU period
        unique_id: xcel_tou_period
        state: >
          {% set h = now().hour %}
          {% if h < 6 %}off_peak
          {% elif now().weekday() < 5 and 18 <= h < 21 %}on_peak
          {% else %}mid_peak
          {% endif %}
