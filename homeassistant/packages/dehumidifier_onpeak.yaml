# The dehumidifier eases off while electricity is at its on-peak price: the target goes up 5 points when on-peak
# starts and back when it ends, so most of the drying happens at the cheaper hours.
#
# My utility's on-peak is weekdays 18:00-21:00. At home the signal comes from a sensor that follows the utility's
# rate schedule (holidays included); the binary sensor below is the stand-alone version of it. Change the hours to
# match your own rate plan.

template:
  - binary_sensor:
      - name: Electricity on-peak
        unique_id: electricity_on_peak
        state: "{{ now().weekday() < 5 and 18 <= now().hour < 21 }}"

input_number:
  dehumidifier_target_before_onpeak:   # the target to go back to after on-peak; 0 = not raised
    name: Dehumidifier target before on-peak
    min: 0
    max: 100
    step: 1

automation:
  - id: dehumidifier_onpeak
    alias: "Dehumidifier eases off during on-peak"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.electricity_on_peak
        from: "off"
        to: "on"
    conditions:
      - condition: numeric_state   # never above 60%: a target already that high is left alone
        entity_id: number.basement_dehumidifier_target_humidity
        below: 56
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.dehumidifier_target_before_onpeak}
        data: {value: "{{ states('number.basement_dehumidifier_target_humidity') | int }}"}
      - action: number.set_value
        target: {entity_id: number.basement_dehumidifier_target_humidity}
        data: {value: "{{ states('number.basement_dehumidifier_target_humidity') | int + 5 }}"}

  - id: dehumidifier_onpeak_over
    alias: "On-peak over, dehumidifier back to its target"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.electricity_on_peak
        from: "on"
        to: "off"
      - trigger: homeassistant   # Home Assistant was down when on-peak ended
        event: start
    conditions:
      - condition: numeric_state
        entity_id: input_number.dehumidifier_target_before_onpeak
        above: 0
      - condition: template
        value_template: "{{ not is_state('binary_sensor.electricity_on_peak', 'on') }}"
    actions:
      - wait_template: "{{ states('number.basement_dehumidifier_target_humidity') | int(0) > 0 }}"   # after a restart
        timeout: "00:05:00"
      # Only if it's still where on-peak put it: a target someone set by hand in the meantime stays.
      - if: "{{ states('number.basement_dehumidifier_target_humidity') | int(0) == states('input_number.dehumidifier_target_before_onpeak') | int + 5 }}"
        then:
          - action: number.set_value
            target: {entity_id: number.basement_dehumidifier_target_humidity}
            data: {value: "{{ states('input_number.dehumidifier_target_before_onpeak') | int }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.dehumidifier_target_before_onpeak}
        data: {value: 0}
