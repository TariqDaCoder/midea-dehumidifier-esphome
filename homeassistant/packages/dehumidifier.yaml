# Home Assistant package for the dehumidifier (ESPHome device "basement-dehumidifier").
# Load it with:   homeassistant: { packages: !include_dir_named packages }
# Needs sensor.xcel_tou_period (electricity_period.yaml) and a dew point sensor for the house air
# (sensor.indoor_dew_point: any thermostat or sensor with temperature and humidity can give one).

template:
  # On/off for Apple Home: HomeKit has no honest tile for an HA climate entity (it would show as a thermostat), so
  # Apple Home gets a plain switch plus the humidity reading; mode, fan and target humidity stay in Home Assistant.
  # A real HomeKit dehumidifier tile needs an HA humidifier entity, and nothing gives one that follows the unit's own
  # buttons (ESPHome and HA's templates have none; generic_hygrostat would switch the unit itself and ignore its panel).
  - switch:
      - name: Basement Dehumidifier
        unique_id: basement_dehumidifier_power
        state: "{{ not is_state('climate.basement_dehumidifier', 'off') }}"
        availability: "{{ states('climate.basement_dehumidifier') not in ['unavailable', 'unknown'] }}"
        turn_on:
          - action: climate.turn_on
            target: {entity_id: climate.basement_dehumidifier}
        turn_off:
          - action: climate.turn_off
            target: {entity_id: climate.basement_dehumidifier}

  # What the unit is really doing. The climate entity's "drying/idle" (hvac_action) only compares the unit's reading
  # with its target (the ESPHome component's guess), not the compressor: on 11-11 house power was higher while it said
  # idle. In Continuous (how HA runs it, below) the compressor runs whenever the unit is on, so the status follows
  # the unit's own state: off, bucket full (it stops), defrosting, else drying. Checked against the house meter's
  # ~390 W step.
  - sensor:
      - name: Basement dehumidifier status
        unique_id: basement_dehumidifier_status
        icon: mdi:air-humidifier
        availability: "{{ states('climate.basement_dehumidifier') not in ['unavailable', 'unknown'] }}"
        state: >
          {% if is_state('climate.basement_dehumidifier', 'off') %}Off
          {% elif is_state('binary_sensor.basement_dehumidifier_bucket_full', 'on') %}Stopped: bucket full
          {% elif is_state('binary_sensor.basement_dehumidifier_defrosting', 'on') %}Defrosting
          {% elif state_attr('climate.basement_dehumidifier', 'preset_mode') == 'Continuous' %}Drying
          {% else %}On ({{ state_attr('climate.basement_dehumidifier', 'preset_mode') }} mode: cycles by itself)
          {% endif %}

automation:
  # How it runs (save energy, stop the wear). Left to itself on "Set 50%" the unit short-cycled:
  # its humidity sensor sits in its own airflow, so with the compressor off the fan blew over the wet coil, the
  # reading climbed 50 -> 61% in a few minutes and restarted the compressor: ~7 min on, ~6.5 min off, ~100 starts a day
  # (seen on the house meter, ~390 W steps), with part of the water going back into the air. Now Home Assistant runs it
  # in "Continuous" (compressor on the whole time) in long runs, at the cheapest price:
  #   - at off-peak (00:00, 7c/kWh) until the basement reads 50% (at least 30 min) or 06:00, on nights the house holds
  #     moisture (living room dew point 50°F or more, ~50% at 70°F) and every third night as a check otherwise
  #     (winter air is dry; no point drying a dry house);
  #   - in the day (mid-peak) if the living room's dew point stays over 52°F for an hour, until 50% or 3 hours;
  #   - anything that turns it on outside off-peak (Apple Home, its buttons) gets 3 hours, and on-peak turns it off.
  - id: basement_dehumidifier_night_run
    alias: "Basement dehumidifier: one long run through off-peak"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.xcel_tou_period
        to: off_peak
      - trigger: homeassistant   # HA restarted during off-peak
        event: start
    conditions:
      - condition: state
        entity_id: sensor.xcel_tou_period
        state: off_peak
      - condition: template   # moisture to remove, or the every-third-night check (mold risk if the basement drifts up)
        value_template: >
          {{ states('sensor.indoor_dew_point') | float(60) >= 50 or now().timetuple().tm_yday % 3 == 0 }}
    actions:
      - action: climate.turn_on
        target: {entity_id: climate.basement_dehumidifier}
      - delay: "00:00:05"
      - action: climate.set_preset_mode
        target: {entity_id: climate.basement_dehumidifier}
        data: {preset_mode: Continuous}

  # A run (the night run, the daytime run, or one started by hand) stops as soon as the basement is dry: once the
  # unit has run 30 minutes, the humidity entity has a
  # reading from this run (the firmware publishes readings only after 20 minutes of running), and at 50% or below it's
  # switched off. So a dry night costs a 30-minute check (~0.2 kWh at 7c) instead of 6 hours.
  - id: basement_dehumidifier_night_run_dry_enough
    alias: "Basement dehumidifier: stop a run once the basement is dry"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: climate.basement_dehumidifier
        state: dry
        for: "00:30:00"
      - condition: template   # a reading from this run, not one kept from an earlier run
        value_template: >
          {{ states('sensor.basement_dehumidifier_humidity') | float(100) <= 50
             and states.sensor.basement_dehumidifier_humidity.last_reported
                 > states.climate.basement_dehumidifier.last_changed }}
    actions:
      - action: climate.turn_off
        target: {entity_id: climate.basement_dehumidifier}

  - id: basement_dehumidifier_night_run_over
    alias: "Basement dehumidifier: off when off-peak ends"
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.xcel_tou_period
        from: off_peak
    actions:
      - action: climate.turn_off
        target: {entity_id: climate.basement_dehumidifier}

  # Daytime: the unit's own reading is only true while it runs, so the living room's dew point stands in (a separate
  # basement sensor would be better). The basement has held the same moisture as upstairs or less
  #, so a 52°F dew point upstairs puts the basement at ~60% or under at its 64-68°F: then the unit runs,
  # mid-peak only, and its own reading stops it at 50% (above), or after 3 hours, or at on-peak.
  - id: basement_dehumidifier_day_run
    alias: "Basement dehumidifier: daytime run when the house air is damp"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.indoor_dew_point
        above: 52
        for: "01:00:00"
    conditions:
      - condition: state
        entity_id: sensor.xcel_tou_period
        state: mid_peak
      - condition: state
        entity_id: climate.basement_dehumidifier
        state: "off"
        for: "01:00:00"
    actions:
      - action: climate.turn_on
        target: {entity_id: climate.basement_dehumidifier}
      - delay: "00:00:05"
      - action: climate.set_preset_mode
        target: {entity_id: climate.basement_dehumidifier}
        data: {preset_mode: Continuous}

  # (A daytime run on the unit's own reading doesn't work: a stopped unit reads 60% while the house is 46%, so it ran
  # 3 hours for nothing. The firmware only publishes the reading while the unit runs.)

  - id: basement_dehumidifier_day_limit
    alias: "Basement dehumidifier: daytime runs last 3 hours, none in on-peak"
    mode: single
    triggers:
      - trigger: state
        entity_id: climate.basement_dehumidifier
        from: "off"
        for: "03:00:00"
        id: three_hours
      - trigger: state
        entity_id: sensor.xcel_tou_period
        to: on_peak
        id: on_peak
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: sensor.xcel_tou_period
            state: off_peak
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.basement_dehumidifier
            state: ["off", "unavailable", "unknown"]
    actions:
      - action: climate.turn_off
        target: {entity_id: climate.basement_dehumidifier}

  # A phone notification when the basement stays over 62% for 3 hours, or the bucket fills. The unit's reading
  # jumps for a few minutes after a run (the wet coil), so the limit is fixed and the wait long.
  - id: basement_dehumidifier_alerts
    alias: "Basement dehumidifier: humidity high or bucket full"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.basement_dehumidifier_humidity
        above: 62
        for: "03:00:00"
        id: humid
      - trigger: state
        entity_id: binary_sensor.basement_dehumidifier_bucket_full
        to: "on"
        id: bucket
    actions:
      - action: notify.notify   # or your phone: notify.mobile_app_<name>
        data:
          title: "{{ 'Dehumidifier bucket full' if trigger.id == 'bucket' else 'Basement still humid' }}"
          message: >
            {{ 'Empty the basement dehumidifier bucket; it stopped until then.' if trigger.id == 'bucket'
               else 'The basement has been over 62% for 3 hours (' ~ states('sensor.basement_dehumidifier_humidity') ~ '%). Check the dehumidifier.' }}
