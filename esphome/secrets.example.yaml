# Copy to secrets.yaml (which is git-ignored) and fill in your own values.
wifi_ssid: "your-wifi-name"
wifi_password: "your-wifi-password"

# 32 random bytes, base64. Make one with:  openssl rand -base64 32
dehumidifier_api_key: "paste-the-output-of-openssl-rand-here"

# Any long random strings.
dehumidifier_ota_password: "change-me"
dehumidifier_ap_password: "change-me-too"   # the fallback hotspot; at least 8 characters
