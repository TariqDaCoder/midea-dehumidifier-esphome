# Midea MAD50PS1BWT-C dehumidifier (basement), its Wi-Fi dongle replaced by an ESP32 on the dongle's UART.
# Component: github.com/Chreece/ESPHome-Dehumidifier (midea_dehum, a port of Hypfer's esp8266-midea-dehumidifier),
# pinned to a commit. Wiring and flashing: the README in this repo.
esphome:
  name: basement-dehumidifier
  friendly_name: Basement Dehumidifier
  min_version: 2025.11.0   # the component's minimum

esp32:
  board: esp32dev          # Inland ESP32-WROOM dev board
  framework:
    type: esp-idf

logger:
  baud_rate: 0             # the hardware UART is the dehumidifier's, not the log's

api:
  encryption:
    key: !secret dehumidifier_api_key

ota:
  - platform: esphome
    password: !secret dehumidifier_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                      # no Wi-Fi: it opens "Basement-Dehumidifier" to set it from a phone
    ssid: Basement-Dehumidifier
    password: !secret dehumidifier_ap_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Chreece/ESPHome-Dehumidifier
      ref: 0e46ee10096ee58213e4e37cc058a3912af9cd99   # main as of 10-05-2026
    components: [midea_dehum]

uart:
  id: uart_midea
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 9600

midea_dehum:
  id: midea_dehum_comp
  uart_id: uart_midea
  protocol_version: 2      # what auto-detect found on the first boot (11-10-2026); pinned, so boot doesn't wait on it
  display_mode_setpoint: Set
  display_mode_continuous: Continuous
  display_mode_smart: Smart
  display_mode_clothes_drying: Dry

# What this unit supports. Its "Device Capabilities" on the first boot (11-10-2026): fan speed, filter reminder, drain
# pump, ionizer, auto humidity control, clothes drying. So no swing, PM2.5 or tank level (they read a constant 0 and
# were removed).
climate:
  - platform: midea_dehum
    midea_dehum_id: midea_dehum_comp
    name: None              # named after the device: climate.basement_dehumidifier (power, mode, fan, humidity)

binary_sensor:
  - platform: midea_dehum
    midea_dehum_id: midea_dehum_comp
    bucket_full:
      id: dehum_bucket_full
      name: Bucket Full
    clean_filter:
      name: Clean Filter
    defrost:
      id: dehum_defrost
      name: Defrosting

button:
  - platform: midea_dehum
    midea_dehum_id: midea_dehum_comp
    filter_cleaned:
      name: Filter Cleaned

sensor:
  - platform: midea_dehum
    midea_dehum_id: midea_dehum_comp
    error:
      name: Error Code
    # The unit's sensor sits in its own airflow: with the unit off, the wet coil and still air read 10-20 points
    # high (11-11-2026: 39 -> 55% within minutes of switching off; 60-61% for hours while the house was 46-49%).
    # Running, it samples room air: in the afternoon it read 40% with the living room at 40%. So this entity (what
    # Home Assistant and Apple Home's "Basement Humidity" show) only takes readings once the unit has run 20 minutes,
    # and not while the bucket is full or it's defrosting; otherwise it keeps the last good one. The raw reading is
    # still the climate entity's current_humidity.
    humidity:
      id: dehum_humidity
      name: Humidity
      filters:
        - lambda: |-
            if (id(run_start) == 0 || millis() - id(run_start) < 20UL * 60UL * 1000UL) return {};
            if (id(dehum_bucket_full).state || id(dehum_defrost).state) return {};
            return x;
    temperature:
      name: Temperature

switch:
  - platform: midea_dehum
    midea_dehum_id: midea_dehum_comp
    ionizer:
      name: Ionizer
    pump:
      name: Pump
    sleep:
      name: Sleep Mode
    beep:
      name: Beep on Command

number:
  - platform: midea_dehum
    midea_dehum_id: midea_dehum_comp
    timer:
      name: Timer
    target_humidity:
      name: Target Humidity

text_sensor:
  - platform: midea_dehum
    midea_dehum_id: midea_dehum_comp
    capabilities:
      name: Device Capabilities
    protocol:
      name: Protocol Version

# When the unit started its current run (0 = off), for the humidity filter above. The component only publishes the
# humidity when it changes, so while a run is past its first 20 minutes the reading is republished every minute.
globals:
  - id: run_start
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 10s
    then:
      - lambda: |-
          if (id(midea_dehum_comp).mode == climate::CLIMATE_MODE_OFF) {
            id(run_start) = 0;
          } else if (id(run_start) == 0) {
            uint32_t now = millis();
            id(run_start) = now ? now : 1;
          }
  - interval: 60s
    then:
      - lambda: |-
          float h = id(midea_dehum_comp).current_humidity;
          if (id(run_start) != 0 && !std::isnan(h) && h > 0) id(dehum_humidity).publish_state(h);
